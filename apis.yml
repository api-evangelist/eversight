name: Eversight
description: 'Eversight is an AI-powered pricing and promotions software company serving consumer packaged
  goods (CPG) brands and retailers. Its SaaS platform runs continuous, controlled experiments testing
  untried everyday prices and promotional offers with real shoppers, then applies advanced analytics and
  AI-powered experimentation to surface revenue-optimizing price and offer recommendations. The product
  is delivered as two suites — a Retail Pricing Suite that integrates with physical and digital store
  networks, and an Offer Innovation Suite for CPG trade-promotion teams that deploys standalone or on top
  of existing TPM systems. Eversight was founded in 2013, acquired by Instacart in 2022, and targets
  revenue-management, trade-marketing, sales, pricing, and merchant teams. It is a portfolio company of
  Emergence Capital. No public developer API, OpenAPI definition, or developer portal is published — the
  platform is an enterprise SaaS engagement.'
